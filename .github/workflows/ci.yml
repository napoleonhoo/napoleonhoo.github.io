name: CI

# 注意：这个 workflow 只做构建校验，不做部署。
# 站点仍由 GitHub 内置的 pages-build-deployment 从 master 分支部署，
# 除非把仓库 Settings -> Pages -> Source 改成 "GitHub Actions"。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # 秒级检查：抓 Markdown 里裸露的 {{ / {%。
  # Jekyll 先跑 Liquid 再跑 Markdown，所以代码块里的 {{ 也会被当变量解析，
  # 不闭合会让 build 直接失败，闭合则会把代码静默渲染成空字符串。
  liquid:
    name: Liquid 分隔符检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ruby .github/scripts/check-liquid.rb

  # 用与 GitHub Pages 相同的 github-pages gem 做一次真实构建，
  # 覆盖 lint 抓不到的问题（缺失的 layout、坏掉的 front matter 等）。
  build:
    name: Jekyll 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不传 ruby-version，setup-ruby 会自动读取 .ruby-version
      # （该输入的默认值即为 "default"，语义是从 .ruby-version /
      # .tool-versions / mise.toml 读取）。这样版本号只在一处维护，
      # 本地 rbenv 与 CI 共用同一个来源。
      # 注意：这个 action 没有 ruby-version-file 输入，传了会被忽略。
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: jekyll build
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata 要调 GitHub API 取仓库信息。匿名请求限额是
          # 60 次/小时/IP，而 runner 出口 IP 是共享的，极易撞限流；在
          # production 下这会升级成致命错误。GITHUB_TOKEN 由 Actions 自动注入，
          # 无需在仓库里配置任何 secret。
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build --trace
